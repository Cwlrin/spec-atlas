        '<p>' + L("一种跑在两线总线上的增强型数字诊断接口。它不改变链路，只回答一个问题：这只模块现在怎么样。","An enhanced diagnostic interface over a 2-wire bus. It does not change the link; it answers one question: how is this module doing.") + '</p></div>' +

        '<p class="eLead">' + L("SFF-8472 是 SFP MSA 中 MOD_DEF（INF-8074）的超集。主机通过 A0h 读身份、A2h 读诊断，每个诊断量 2 字节、MSB 在前；若 A0h 字节 92 比特 2 置位，访问 A2h 前要先执行地址切换序列。", "SFF-8472 is a superset of MOD_DEF (INF-8074). The host reads identity at A0h and diagnostics at A2h, two bytes per value, MSB first. If bit 2 of A0h byte 92 is set, run the address-change sequence before touching A2h.") + '</p>' +
        '<div class="eGrid3">' +
          '<div><h4>' + L("身份在 A0h","Identity at A0h") + '</h4><p>' + L("标识符、连接器、速率、厂商名 / PN / SN、合规版本，以及两个校验码 CC_BASE / CC_EXT。", "Identifier, connector, rate, vendor name/PN/SN, compliance revision, and two checksums.") + '</p></div>' +
          '<div><h4>' + L("诊断在 A2h","Diagnostics at A2h") + '</h4><p>' + L("40 字节阈值、36 字节校准或增强特性、10 字节实时量、状态与告警标志。", "40 threshold bytes, 36 calibration/enhanced bytes, 10 real-time bytes, status and flags.") + '</p></div>' +
          '<div><h4>' + L("两种校准","Two calibrations") + '</h4><p>' + L("内部校准读到绝对值；外部校准读到 A/D 计数，须用常数换算。", "Internal calibration yields absolute values; external yields A/D counts needing conversion.") + '</p></div>' +
        '</div>' +
        '<div class="eLabel" style="margin-top:24px"><span>TABLES</span><b>' + L("表索引","Table index") + '</b></div>' +
        tableChips() +
        '</div>' +
      '<div class="eSec" id="e-reg"><div class="eLabel"><span>02 / REGISTERS</span><b>' + L("A0h 字段","A0h fields") + '</b></div>' + rows + '</div>' +
      '<div class="eSec" id="e-map"><div class="eLabel"><span>03 / MEMORY MAP</span><b>' + L("A2h 内存","A2h memory") + '</b></div>' +
        '<div class="eDots">' + dots + '</div>' +
        '<div class="eLegend">' +
          '<span><i style="background:#FFE6EF"></i>' + Lin("阈值 0-55","thresholds") + '</span>' +
          '<span><i style="background:#DCE4FF"></i>' + Lin("校准/增强 56-94","cal") + '</span>' +
          '<span><i style="background:#DFF3E8"></i>' + Lin("实时量 96-105","real-time") + '</span>' +
          '<span><i style="background:#7C9CFF"></i>' + Lin("本版变更","changed") + '</span>' +
        '</div></div>' +
      '<div class="eSec" id="e-dia"><div class="eLabel"><span>04 / DIAGNOSTICS</span><b>' + L("实时量","Real-time") + '</b></div><div class="eStats">' + stats + '</div></div>' +
      '<div class="eSec" id="e-diff"><div class="eLabel"><span>05 / REVISION</span><b>' + L("版本对照", "Revision") + '</b></div>' +
        '<div class="eDiff"><div><h3>REV ' + PREV[state.rev] + '</h3>' + ld + '</div><div><h3>REV ' + state.rev + '</h3>' + rd + '</div></div></div>' +
    '</div>' +
    '<div class="eMascot">SFP<br>娘</div>';
}

function mapCells(cls, rev) {
  var cells = "";
  for (var b = 0; b < 256; b++) {
    var z = zoneOf(b), c = cls + " " + (z.z === "z1" || z.z === "z2" || z.z === "z3" || z.z === "z5" ? z.z : "");
    if (z.key === "th") c += " z5";
    if (changedInByte(b, rev)) c += " chg";
    cells += '<div class="' + c + '">' + hex(b) + '</div>';
  }
  return cells;
}

function renderJ() {
  var rows = "";
  for (var i = 0; i < A0.length; i++) {
    var r = A0[i];
    rows += '<div class="jRow"><span class="jAddr">' + r.a + '</span><div><h3>' + esc(r.en) + '<span>' + esc(r.zh) + '</span></h3><p>' + LT(r.dZh, r.dEn) + '</p></div></div>';
  }
  var dots = "";
  for (var b = 0; b < 256; b++) {
    var z = zoneOf(b), c = "jDot";
    if (z.z === "z1") c += " z1"; else if (z.z === "z2") c += " z2"; else if (z.z === "z3") c += " z3";
    if (z.key === "th" || z.key === "fl") c += " z5";
    if (changedInByte(b, state.rev)) c += " chg";
    dots += '<div class="' + c + '"></div>';
  }
  var stats = "";
  for (var s = 0; s < DIAG.length; s++) stats += '<div class="jStat"><b>' + DIAG[s].v + '</b><span>' + esc(DIAG[s].zh) + '</span></div>';
  var ld = "", rd = "", list = diffsOf(state.rev);
  for (var m = 0; m < list.length; m++) {
    ld += '<p>' + esc(list[m].a) + ' · ' + esc(list[m].oldZh || "（此前无此定义）") + '</p>';
    rd += '<p class="' + (list[m].kind === "chg" ? "hot" : "") + '">' + esc(list[m].a) + ' · ' + esc(list[m].zh) + '</p>';
  }
  return '<div class="jWrap">' +
    '<div class="jHead"><div class="jKick">SFF-8472 · SFP+ MANAGEMENT INTERFACE</div>' +
      '<h1>管理接口规范</h1><p>REV ' + state.rev + ' ／ 2021.03.31</p>' +
      '<div class="jCtl">' + langChips("jChip") + revChips("jChip") + '</div></div>' +
    '<section class="jSec"><div class="jLabel"><span>01</span><b>概览</b></div>' +
      '<p class="jLead">' + L("增强型数字诊断接口是 SFP MSA 中 MOD_DEF 的超集。它不改变光链路，只把模块内部的温度、电压、偏置与收发光功率数字化，交给主机读取；越界时点亮告警标志。", "A superset of MOD_DEF. It does not touch the link; it digitizes temperature, voltage, bias and optical power for the host, and lights alarm flags on threshold violations.") + '</p>' +
      '<div class="jCols3">' +
        '<div><h4>两处藏身</h4><p>' + L("A0h 存身份，A2h 存诊断，各 256 字节。", "A0h identity, A2h diagnostics, 256 bytes each.") + '</p></div>' +
        '<div><h4>两种校准</h4><p>' + L("92h 比特 5 内部（绝对值），比特 4 外部（计数换算）。", "92h bit 5 internal, bit 4 external counts.") + '</p></div>' +
        '<div><h4>一处留心</h4><p>' + L("多字节字段必须单次两字节读。", "Multi-byte fields need one two-byte read.") + '</p></div>' +
      '</div>' +
      '<div style="margin-top:18px">' + tableChips() + '</div></section>' +
    '<section class="jSec"><div class="jLabel"><span>02</span><b>A0h 字段</b></div>' + rows + '</section>' +
    '<section class="jSec"><div class="jLabel"><span>03</span><b>A2h 内存</b></div>' +
      '<div class="jMap">' + dots + '</div><div class="jNote">' + L("描边 = 本版语义变更", "outline = changed in this revision") + '</div></section>' +
    '<section class="jSec"><div class="jLabel"><span>04</span><b>实时量</b></div><div class="jStats">' + stats + '</div></section>' +
    '<section class="jSec"><div class="jLabel"><span>05</span><b>版本对照</b></div>' +
      '<div class="jDiff"><div><h3>REV ' + PREV[state.rev] + '</h3>' + ld + '</div><div><h3>REV ' + state.rev + '</h3>' + rd + '</div></div></section>' +
  '</div>';
}

function renderM() {
  var rows = "";
  for (var i = 0; i < A0.length; i++) {
    var r = A0[i];
    rows += '<div class="mRow"><b>' + r.a + '</b><div><h3>' + esc(r.en) + '<span>' + esc(r.zh) + '</span></h3><p>' + LT(r.dZh, r.dEn) + '</p></div></div>';
  }
  var cells = "";
  for (var b = 0; b < 256; b++) {
    var z = zoneOf(b), c = "mCell";
    if (z.z === "z1") c += " z1"; else if (z.z === "z2") c += " z2"; else if (z.z === "z3") c += " z3";
    if (z.key === "th" || z.key === "fl") c += " z5";
    if (changedInByte(b, state.rev)) c += " chg";
    cells += '<div class="' + c + '">' + hex(b) + '</div>';
  }
  var meters = "";
  for (var s = 0; s < 5; s++) meters += '<div class="mMeter"><b>' + DIAG[s].v + '</b><span>' + esc(DIAG[s].zh) + '</span><i style="width:' + DIAG[s].pct + '%"></i></div>';
  var ld = "", rd = "", list = diffsOf(state.rev);
  for (var m = 0; m < list.length; m++) {
    ld += '<p>' + esc(list[m].a) + ' · ' + esc(list[m].oldZh || "（此前无此定义）") + '</p>';
    rd += '<p>' + esc(list[m].a) + ' · ' + esc(list[m].zh) + '</p>';
  }
  return '<div class="mHead"><div class="m39">39</div>' +
      '<div class="mKick">SFF-8472 · SFP+ MANAGEMENT INTERFACE</div>' +
      '<h1>管理接口规范</h1><p>REV ' + state.rev + ' ／ 2021.03.31 ／ TRACK 01</p>' +
      '<div class="mBand"></div>' +
      '<div class="mCtl">' + langChips("mChip") + revChips("mChip") + '</div></div>' +
    '<div class="mWrapIn">' +
      '<section class="mSec"><h2>' + L("概览", "Overview") + '<em>01 / INTRO</em></h2>' +
        '<p class="mLead">' + L("增强型数字诊断接口是 SFP MSA 中 MOD_DEF 的超集。一条两线总线，把模块内部的温度、电压、偏置与收发光功率数字化，交给主机读取；越界时点亮告警标志。", "A superset of MOD_DEF: one 2-wire bus digitizing temperature, voltage, bias and optical power for the host, with alarm flags on threshold violations.") + '</p>' +
        '<div class="mCols3">' +
          '<div><h4>' + L("两个地址", "Two addresses") + '</h4><p>' + L("A0h 身份，A2h 诊断，各 256 字节。", "A0h identity, A2h diagnostics, 256 bytes each.") + '</p></div>' +
          '<div><h4>' + L("两种校准", "Two calibrations") + '</h4><p>' + L("92h 比特 5 内部，比特 4 外部。", "92h bit 5 internal, bit 4 external.") + '</p></div>' +
          '<div><h4>' + L("一处留心", "One caveat") + '</h4><p>' + L("多字节字段必须单次两字节读。", "Multi-byte fields need one two-byte read.") + '</p></div>' +
        '</div>' +
        '<div style="margin-top:16px">' + tableChips() + '</div></section>' +
      '<section class="mSec"><h2>' + L("字段", "Fields") + '<em>02 / A0H</em></h2>' + rows + '</section>' +
      '<section class="mSec"><h2>' + L("内存地图", "Memory map") + '<em>03 / A2H</em></h2><div class="mMap">' + cells + '</div></section>' +
      '<section class="mSec"><h2>' + L("实时量", "Real-time") + '<em>04 / 96-105</em></h2><div class="mMeters">' + meters + '</div></section>' +
      '<section class="mSec"><h2>' + L("版本对照", "Revision") + '<em>05 / ' + PREV[state.rev] + ' → ' + state.rev + '</em></h2>' +
        '<div class="mDiff"><div><h3>REV ' + PREV[state.rev] + '</h3>' + ld + '</div><div><h3>REV ' + state.rev + '</h3>' + rd + '</div></div></section>' +
    '</div>';
}

var ORDER2 = ["B","J","E","M"];
var ORDER = ORDER2;
function render() {
  document.body.className = "v" + state.v;
  var app = document.getElementById("app");
  var fn = { B: renderB, E: renderE, J: renderJ, M: renderM }[state.v] || renderB;
  app.innerHTML = fn();
  syncSkin();
  try {
    if (location.protocol !== "file:") {
      var u = new URL(location.href);
      u.searchParams.set("variant", state.v);
      history.replaceState(null, "", u);
    }
  } catch (err) {}
  renderSheet();
}
function syncSkin() {
  var p = document.getElementById("skinPanel");
  if (!p) return;
  var opts = p.querySelectorAll("[data-act='skin']");
  for (var i = 0; i < opts.length; i++) {
    if (opts[i].getAttribute("data-val") === state.v) opts[i].classList.add("on");
    else opts[i].classList.remove("on");
  }
}
function saveSkin() { try { localStorage.setItem("sff8472-skin", state.v); } catch (e) {} }
function cycle(step) {
  var i = ORDER.indexOf(state.v);
  state.v = ORDER[(i + step + ORDER.length) % ORDER.length];
  render();
}
document.addEventListener("click", function(e) {
  if (!e.target.closest(".skin")) { var bp = document.getElementById("skinPanel"); if (bp) bp.classList.remove("open"); }
  var el = e.target.closest("[data-act]");
  if (!el) return;
  var act = el.getAttribute("data-act"), val = el.getAttribute("data-val");
  if (act === "lang") { state.lang = val; render(); }
  else if (act === "rev") { state.rev = val; render(); }
  else if (act === "sel") { state.sel = parseInt(val, 10); render(); }
  else if (act === "tab") { state.tab = val; render(); }
  else if (act === "jump") {
    var t = document.getElementById(val);
    if (t) t.scrollIntoView({ behavior:"smooth", block:"start" });
  }
  else if (act === "table") { state.table = val; renderSheet(); }
  else if (act === "closeTable") { state.table = null; renderSheet(); }
  else if (act === "skin") { state.v = val; saveSkin(); var pn = document.getElementById("skinPanel"); if (pn) pn.classList.remove("open"); render(); window.scrollTo({ top: 0, behavior: "instant" }); }
  else if (act === "skinToggle") { var pn2 = document.getElementById("skinPanel"); if (pn2) pn2.classList.toggle("open"); }
  else if (act === "prev") cycle(-1);
  else if (act === "next") cycle(1);
});
document.addEventListener("keydown", function(e) {
  var t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.key === "Escape" && state.table) { state.table = null; renderSheet(); }
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});
(function boot() {
  var p = new URLSearchParams(location.search).get("variant");
  var saved = null;
  try { saved = localStorage.getItem("sff8472-skin"); } catch (e) {}
  if (p && NAMES[p]) state.v = p;
  else if (saved && NAMES[saved]) state.v = saved;
  render();
  try {
    if (!localStorage.getItem("sff8472-skin-tip")) {
      var tip = document.getElementById("skinTip");
      if (tip) {
        tip.classList.add("show");
        setTimeout(function () { tip.classList.remove("show"); }, 6500);
      }
      localStorage.setItem("sff8472-skin-tip", "1");
    }
  } catch (e) {}
})();
</script>
</body>
</html>
